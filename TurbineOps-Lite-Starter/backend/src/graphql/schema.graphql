type Turbine {
  id: ID!
  name: String!
  manufacturer: String
  mwRating: Float
  lat: Float
  lng: Float
  inspections: [Inspection!]!
}

enum DataSource {
  DRONE
  MANUAL
}

type Inspection {
  id: ID!
  date: String!
  inspectorName: String
  dataSource: DataSource!
  rawPackageUrl: String
  turbine: Turbine!
  findings: [Finding!]!
  repairPlan: RepairPlan
}

enum FindingCategory {
  BLADE_DAMAGE
  LIGHTNING
  EROSION
  UNKNOWN
}

type Finding {
  id: ID!
  inspectionId: ID!
  inspection: Inspection!
  category: FindingCategory!
  severity: Int!
  estimatedCost: Float!
  notes: String
}

enum Priority {
  LOW
  MEDIUM
  HIGH
}

type RepairPlan {
  id: ID!
  priority: Priority!
  totalEstimatedCost: Float!
  maxSeverity: Int!
  findingCount: Int!
  createdAt: String!
}

type Query {
  turbines: [Turbine!]!
  inspection(id: ID!): Inspection
  inspections(turbineId: ID, from: String, to: String, dataSource: DataSource): [Inspection!]!
  repairPlan(inspectionId: ID!): RepairPlan
  searchFindings(q: String!, inspectionId: ID): [Finding!]!
}