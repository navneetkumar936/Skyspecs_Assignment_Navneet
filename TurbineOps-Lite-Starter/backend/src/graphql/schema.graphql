type Turbine {
  id: ID!
  name: String!
  manufacturer: String
  mwRating: Float
  lat: Float
  lng: Float
  inspections: [Inspection!]!
}

enum DataSource {
  DRONE
  MANUAL
}

type Inspection {
  id: ID!
  date: String!
  inspectorName: String
  dataSource: DataSource!
  rawPackageUrl: String
  turbine: Turbine!
  findings: [Finding!]!
  repairPlan: RepairPlan
}

enum FindingCategory {
  BLADE_DAMAGE
  LIGHTNING
  EROSION
  UNKNOWN
}

type Finding {
  id: ID!
  inspectionId: ID!
  inspection: Inspection!
  category: FindingCategory!
  severity: Int!
  estimatedCost: Float!
  notes: String
}

enum Priority {
  LOW
  MEDIUM
  HIGH
}

type RepairPlan {
  id: ID!
  priority: Priority!
  totalEstimatedCost: Float!
  maxSeverity: Int!
  findingCount: Int!
  createdAt: String!
}

input CreateInspectionInput {
  turbineId: ID!
  date: String!
  inspectorName: String
  dataSource: DataSource!
  rawPackageUrl: String
}

input FindingInput {
  category: FindingCategory!
  severity: Int!
  estimatedCost: Float!
  notes: String
}

input UpdateFindingInput {
  category: FindingCategory
  severity: Int
  estimatedCost: Float
  notes: String
}

type Query {
  inspections(turbineId: ID, from: String, to: String, dataSource: DataSource): [Inspection!]!
  inspection(id: ID!): Inspection
  repairPlan(inspectionId: ID!): RepairPlan
  searchFindings(q: String!): [Finding!]!
}

type Mutation {
  createInspection(input: CreateInspectionInput!): Inspection!
  createFinding(inspectionId: ID!, input: FindingInput!): Finding!
  updateFinding(id: ID!, input: UpdateFindingInput!): Finding!
  deleteRepairPlan(inspectionId: ID!): Boolean!
  generateRepairPlan(inspectionId: ID!): RepairPlan!
}